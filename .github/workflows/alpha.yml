name: Lanternfin alpha

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_APP_MODE: standalone
  XTREAM_TV_BUILD: "1"
  XT_SKIP_FFMPEG_SIDECAR: "1"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: lanternfin-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust-target: aarch64-linux-android
          - target: armv7
            rust-target: armv7-linux-androideabi
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.13846066"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.rust-target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: "src-tauri -> target"
          key: lanternfin-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build standalone TV APK (unsigned alpha)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13846066
        run: pnpm tauri android build --ci --apk --target ${{ matrix.target }}
      - name: Verify APK identity and record checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "$apk.manifest.txt"
            grep -q "package: name='io.github.jpauldev.lanternfin'" "$apk.manifest.txt"
            grep -q "application-label:'Lanternfin TV'" "$apk.manifest.txt"
            sha256sum "$apk" > "$apk.sha256"
          done
          {
            echo "Source commit: $GITHUB_SHA"
            rustc --version
            cargo --version
            node --version
            pnpm --version
          } > src-tauri/gen/android/app/build/outputs/apk/toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lanternfin-android-${{ matrix.target }}-unsigned-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.txt
            src-tauri/gen/android/app/build/outputs/apk/**/*.sha256
          if-no-files-found: error
          retention-days: 14
