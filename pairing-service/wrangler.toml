name = "lanternfin-pairing"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "PairingSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingSession"]

[[ratelimits]]
name = "PAIRING_LIMITER"
namespace_id = "160151001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "POLL_LIMITER"
namespace_id = "160151002"
simple = { limit = 120, period = 60 }

[observability]
enabled = false
