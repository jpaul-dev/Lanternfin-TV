name: LG and Samsung TV previews
on:
  push:
    branches: [main, 'ports/**']
    paths: ['tv-app/**', 'tv-setup/**', 'Open TV Setup*', 'scripts/*-tv.mjs', 'tests/tv-port-*.test.ts', 'tests/tv-setup-*.test.ts', 'src/scripts/lib/m3u-parser.ts', 'packaging/tv-tools/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/tv-ports.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run tests/tv-setup-security.test.ts tests/tv-setup-workflow.test.ts
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm ci --prefix packaging/tv-tools --ignore-scripts --no-fund --no-audit
      - run: pnpm tv:check
      - run: pnpm test
      - run: pnpm tv:build
      - run: pnpm tv:package:webos
      - run: pnpm tv:package:tizen
      - uses: actions/upload-artifact@v4
        with:
          name: lanternfin-tv-previews-${{ github.sha }}
          path: |
            artifacts/tv-preview-0.1.0/
            dist/tv/
          if-no-files-found: error
          retention-days: 14
